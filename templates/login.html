<!doctype html>
<html lang="es" class="theme-deep-space dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — DDN Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center bg-deep-space text-slate-200 p-4">
  <div class="w-full max-w-sm p-8 rounded-3xl bg-black/30 backdrop-blur-2xl border border-white/10 shadow-2xl space-y-6">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
      <div class="p-3 rounded-xl text-white text-xs font-bold {{ 'bg-emerald-600' if cat=='success' else 'bg-rose-600' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="text-center space-y-3">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 ring-1 ring-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3.5 4.5 V19.5" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
          <path d="M3.5 4.5 A9.5 9.5 0 0 1 3.5 19.5" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 4.5 V19.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 4.5 L20.5 19.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.5 19.5 V4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="font-black text-xl text-white tracking-[0.18em]">DDN&nbsp;TRAVEL</p>
        <p class="text-xs text-slate-400 mt-0.5">Inicia sesión en el panel de gestión</p>
      </div>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-3">
      <div class="space-y-1.5">
        <label class="text-2xs font-bold text-slate-400 uppercase tracking-widest">Correo</label>
        <input name="email" type="email" required placeholder="tu@correo.com"
               class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50">
      </div>
      <div class="space-y-1.5">
        <label class="text-2xs font-bold text-slate-400 uppercase tracking-widest">Contraseña</label>
        <input name="password" type="password" required placeholder="••••••"
               class="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50">
      </div>
      <button class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-bold shadow-lg shadow-indigo-600/25">
        Entrar
      </button>
    </form>

    {% if google_enabled %}
    <div class="flex items-center gap-3">
      <div class="h-px flex-1 bg-white/10"></div>
      <span class="text-2xs text-slate-500 uppercase tracking-widest">o</span>
      <div class="h-px flex-1 bg-white/10"></div>
    </div>
    <a href="{{ url_for('main.google_login') }}"
       class="w-full flex items-center justify-center gap-2.5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-semibold text-white transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.4-5.1l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/>
      </svg>
      Continuar con Google
    </a>
    {% endif %}
  </div>
</body>
</html>
