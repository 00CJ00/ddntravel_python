<!doctype html>
<html lang="es" class="theme-deep-space dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ code }} — DDN Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="min-h-screen flex items-center justify-center bg-deep-space text-slate-200 p-4">
  <div class="text-center space-y-5 max-w-md">
    <p class="text-7xl font-black text-indigo-500">{{ code }}</p>
    <p class="text-white font-bold text-lg">{{ message }}</p>
    <p class="text-xs text-slate-400">Si crees que es un error, contacta al administrador del sistema.</p>
    <a href="{{ url_for('main.dashboard') }}"
       class="inline-block px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-bold shadow-lg shadow-indigo-600/25">
      Volver al panel
    </a>
  </div>
</body>
</html>
